<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%230f2235%22/%3E%3Cpath d=%22M6 40h52M10 40l8-14 8 14 8-14 8 14 8-14 8 14M18 26h32%22 stroke=%22%23ffd43b%22 stroke-width=%224%22 fill=%22none%22 stroke-linejoin=%22round%22/%3E%3Crect x=%224%22 y=%2240%22 width=%2256%22 height=%225%22 fill=%22%23cfd8e3%22/%3E%3C/svg%3E">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1622;color:#eef4fa;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}
#app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr)}
#hud{display:flex;align-items:center;gap:12px;padding:6px 12px;background:linear-gradient(180deg,#0f2235f2,#0c1b2bf2);border-bottom:1px solid #ffffff14;z-index:3;min-height:50px}
.lvl{min-width:0;flex:0 1 auto}
.lvl b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvl small{display:block;font-size:11px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:42vw}
#budget{flex:1 1 180px;min-width:120px;max-width:360px}
#budget .row{display:flex;justify-content:space-between;font-size:13px;font-variant-numeric:tabular-nums;gap:6px}
#budget .bar{height:9px;border-radius:6px;background:#ffffff1c;overflow:hidden;margin-top:3px;position:relative}
#budget .fill{height:100%;width:0;background:linear-gradient(90deg,#2fbf71,#a3e635);transition:width .25s}
#budget.warnb .fill{background:linear-gradient(90deg,#f59f00,#ffd43b)}
#budget.over .fill{background:linear-gradient(90deg,#ff6b4a,#ff3b30)}
#budget.over b{color:#ff9b8a}
.pill{font-size:12px;padding:5px 11px;border-radius:20px;background:#2563eb;font-weight:800;letter-spacing:.04em;white-space:nowrap}
.pill.test{background:#ea580c}
.iconbtn{appearance:none;border:0;background:#1d3550;color:#fff;width:40px;height:40px;border-radius:12px;font-size:18px;cursor:pointer;flex:0 0 auto}
#stage{position:relative;overflow:hidden;min-height:0;min-width:0;background:#7fb2e5}
#stage canvas{position:absolute;inset:0;width:100%!important;height:100%!important;display:block;touch-action:none}
#toolbar{display:flex;flex-wrap:wrap;gap:6px;padding:7px;justify-content:center;background:linear-gradient(180deg,#0c1b2bf2,#08131f);border-top:1px solid #ffffff14;z-index:3}
.group{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.sep{width:1px;background:#ffffff1f;margin:2px}
.btn{appearance:none;border:0;border-radius:13px;min-width:58px;min-height:54px;padding:4px 8px;font:inherit;font-size:12px;font-weight:650;color:#eef4fa;background:linear-gradient(180deg,#24405e,#1a314a);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;box-shadow:0 2px 0 #0008,inset 0 1px 0 #ffffff1a;transition:transform .08s,background .15s,box-shadow .15s;position:relative}
.btn .ic{font-size:19px;line-height:1}
.btn:active{transform:translateY(1px)}
.btn.sel{background:linear-gradient(180deg,#3d8be0,#2a6fc0);box-shadow:0 0 0 2px #a9d4ff,0 2px 0 #0008}
.btn .sw{width:30px;height:9px;border-radius:5px}
.btn .drv{position:absolute;top:2px;right:4px;font-size:10px}
.btn.go{background:linear-gradient(180deg,#34c06a,#23964f);min-width:92px;font-size:14px}
.btn.go.stop{background:linear-gradient(180deg,#f07a2e,#c85a17)}
.btn.go:disabled{background:#4a5563;opacity:.7}
.btn.warn{background:linear-gradient(180deg,#8a3434,#6b2525)}
.btn:disabled{opacity:.45}
#hintBar{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:#08131fd9;padding:7px 14px;border-radius:12px;font-size:13px;max-width:min(92%,640px);text-align:center;pointer-events:none;transition:opacity .3s;border:1px solid #ffffff1a;box-shadow:0 6px 20px #0005}
#hintBar b{color:#ffd43b}
#legend{position:absolute;right:10px;top:10px;background:#08131fd9;border-radius:12px;padding:8px 11px;font-size:11px;pointer-events:none;border:1px solid #ffffff1a;min-width:150px}
#legend .g{height:9px;border-radius:5px;background:linear-gradient(90deg,#22c55e,#facc15 50%,#ef4444);margin:5px 0 2px}
#legend .r{display:flex;justify-content:space-between;opacity:.85}
#legend .row{display:flex;align-items:center;gap:6px;margin-top:4px}
#legend .sw{width:22px;height:7px;border-radius:4px;flex:0 0 auto}
#legend .max{font-weight:800;font-size:13px;margin-top:4px}
#label3d{position:absolute;transform:translate(-50%,-130%);background:#08131fe6;border:1px solid #ffffff2a;padding:5px 10px;border-radius:9px;font-size:13px;font-weight:700;pointer-events:none;white-space:nowrap;display:none;box-shadow:0 4px 14px #0006}
#label3d.bad{color:#ff9b8a}
#toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%) translateY(16px);opacity:0;background:#122840;border:1px solid #ffffff30;padding:9px 15px;border-radius:12px;font-size:14px;pointer-events:none;transition:all .25s;z-index:5;text-align:center;max-width:90%}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#matTip{position:absolute;left:10px;bottom:10px;background:#08131fe8;border:1px solid #ffffff22;border-radius:14px;padding:10px 12px;font-size:12px;width:250px;pointer-events:none;transition:opacity .3s;opacity:0}
#matTip.show{opacity:1}
#matTip h4{margin:0 0 4px;font-size:15px}
#matTip .stat{display:flex;align-items:center;gap:6px;margin-top:3px}
#matTip .stat span:first-child{width:72px;opacity:.75}
#matTip .meter{flex:1;height:6px;background:#ffffff1a;border-radius:4px;overflow:hidden}
#matTip .meter i{display:block;height:100%;background:#60a5fa}
.overlay{position:fixed;inset:0;background:#040b14b8;display:none;align-items:center;justify-content:center;z-index:10;padding:12px;backdrop-filter:blur(4px)}
.overlay.show{display:flex}
.card{background:linear-gradient(180deg,#183252,#10233a);border:1px solid #ffffff22;border-radius:20px;padding:18px 20px;max-width:600px;width:100%;max-height:100%;overflow:auto;box-shadow:0 24px 70px #000b;text-align:center}
.card h2{margin:2px 0 8px;font-size:25px}
.card p{margin:6px 0;opacity:.92;font-size:14px;line-height:1.45}
.card .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.card .btns .btn{min-width:130px;font-size:15px;flex-direction:row;gap:7px;padding:8px 16px}
.tips{text-align:left;font-size:14px;margin:8px 0;padding-left:22px}
.tips li{margin:5px 0}
.stars{font-size:34px;letter-spacing:6px;margin:4px 0}
.stars .off{opacity:.2}
.lvlgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:10px}
.lvlcard{background:#203d5e;border-radius:14px;padding:12px;cursor:pointer;text-align:left;border:2px solid transparent;color:inherit;font:inherit}
.lvlcard:hover,.lvlcard.cur{border-color:#a9d4ff}
.lvlcard b{font-size:15px}
.lvlcard div{font-size:12px;opacity:.85;margin-top:4px}
.lvlcard .done{color:#86efac;font-weight:700}
.win h2{color:#86efac}.fail h2{color:#ff9b8a}
#windBox{position:absolute;left:10px;top:10px;display:none;align-items:center;gap:8px;background:#08131fd9;border:1px solid #ffffff1a;border-radius:12px;padding:6px 10px;font-size:12px;pointer-events:none}
#windBox.show{display:flex}
#windBox .wi{font-size:20px}
#windBox .wbar{width:90px;height:6px;border-radius:4px;background:#ffffff1c;overflow:hidden;margin-top:3px}
#windBox .wbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7dd3fc,#38bdf8,#f472b6)}
#windArrow{font-size:20px;color:#7dd3fc;display:inline-block;transition:transform .2s}
#camPanel{position:absolute;right:10px;top:60px;display:none;flex-direction:column;gap:6px;background:#08131fe8;border:1px solid #ffffff22;border-radius:14px;padding:10px 12px;font-size:12px;z-index:4;width:210px}
#camPanel.show{display:flex}
#camPanel label{display:flex;flex-direction:column;gap:2px}
#camPanel input[type=range]{width:100%;height:30px;accent-color:#60a5fa;touch-action:none}
.btn.mini{min-height:34px;font-size:12px;flex-direction:row}
.pill.ex{background:#a855f7}
#gMat .btn{min-width:56px}
@media (orientation:landscape) and (max-height:520px){
  #app{grid-template-columns:1fr auto;grid-template-rows:auto 1fr}
  #hud{grid-column:1;grid-row:1;min-height:40px;padding:3px 10px;gap:8px}
  .lvl b{font-size:14px}.lvl small{display:none}
  .iconbtn{width:34px;height:34px;font-size:16px}
  #stage{grid-column:1;grid-row:2}
  #toolbar{grid-column:2;grid-row:1/3;flex-direction:column;flex-wrap:nowrap;justify-content:flex-start;border-top:0;border-left:1px solid #ffffff14;padding:5px;overflow-y:auto}
  #toolbar .group{display:grid;grid-template-columns:repeat(4,46px);gap:4px}
  #toolbar .sep{width:auto;height:1px;margin:2px 0}
  .btn,#gMat .btn{min-width:46px;min-height:40px;font-size:9.5px;border-radius:10px;padding:2px 3px;gap:1px}
  #toolbar{gap:4px}#toolbar .group{gap:4px}
  .btn .ic{font-size:16px}.btn .sw{width:24px;height:7px}
  .btn.go{min-width:46px;grid-column:span 4;font-size:13px;min-height:42px}
  #camPanel{top:46px}
  #windBox{top:5px;left:6px;padding:4px 8px}
  #hintBar{font-size:11px;top:5px;padding:5px 10px}
  #legend{font-size:10px;padding:6px 8px;min-width:130px}
  #matTip{width:220px;font-size:11px}
  #legend.build{display:none}
}
@media (max-width:560px){.lvl{max-width:36vw;flex:0 1 36vw}.lvl b{font-size:13px;line-height:1.15;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-overflow:clip;word-break:normal;hyphens:auto}#budget .row{font-size:12px;white-space:nowrap}#budget .row span:last-child{white-space:nowrap}#budget{min-width:90px}.iconbtn{width:34px;height:34px;font-size:15px}.pill{padding:4px 8px;font-size:11px}#budget .row span:first-child{display:none}#budget .row{justify-content:flex-end}.sep{display:none}#hud{gap:6px;padding:5px 8px}.lvl small{display:none}.btn{min-width:52px;font-size:10.5px}#legend{top:auto;bottom:10px;right:8px}#matTip{bottom:auto;top:56px}
  #gMat{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;width:100%;min-width:0;max-width:100%;flex:1 1 100%;touch-action:pan-x;padding-bottom:2px;scrollbar-width:thin}
  #gMat .btn{flex:0 0 auto;min-width:54px}
  #windBox{top:auto;bottom:10px;left:8px}#hintBar{top:6px}
  #legend.build{display:none}
}
#legend .lgrid{display:grid;grid-template-columns:1fr 1fr;column-gap:10px}
#legend .row.cur{color:#ffd43b;font-weight:700}
</style></head><body>
<div id="app">
  <header id="hud">
    <div class="lvl"><b id="lvlName">Level</b><small id="lvlDesc"></small></div>
    <div id="budget"><div class="row"><span>Kosten / Budget</span><span><b id="costTxt">0 €</b> / <span id="budgetTxt">0 €</span></span></div><div class="bar"><div class="fill" id="budgetFill"></div></div></div>
    <span class="pill" id="modeTag">BAUEN</span>
    <button class="iconbtn" id="bCam" title="Kamerawinkel">🎥</button>
    <button class="iconbtn" id="bSound" title="Ton an/aus">🔊</button>
  </header>
  <main id="stage">
    <div id="hintBar"></div>
    <div id="legend"></div>
    <div id="label3d"></div>
    <div id="matTip"></div>
    <div id="toast"></div>
    <div id="windBox"><span class="wi">💨</span><div><b id="windTxt">Wind</b><div class="wbar"><i id="windFill"></i></div></div><span id="windArrow">⟵</span></div>
    <div id="camPanel"><label>Drehen <input type="range" id="camYaw" min="-45" max="45" step="1" value="-9"></label><label>Neigen <input type="range" id="camPitch" min="0" max="40" step="1" value="6"></label><button class="btn mini" id="camReset">Standard</button></div>
  </main>
  <nav id="toolbar">
    <div class="group" id="gMat">
      <button class="btn" data-tool="road" title="Straße"><span class="drv">🚗</span><span class="sw" style="background:#2b2f36;box-shadow:inset 0 0 0 2px #facc15"></span>Straße</button>
      <button class="btn" data-tool="wood" title="Holz"><span class="sw" style="background:linear-gradient(90deg,#a86b35,#d79a5a,#a86b35)"></span>Holz</button>
      <button class="btn" data-tool="alu" title="Aluminium"><span class="sw" style="background:linear-gradient(180deg,#f8fafc,#c4ccd6 60%,#e5e9ee)"></span>Alu</button>
      <button class="btn" data-tool="cast" title="Gusseisen"><span class="sw" style="background:radial-gradient(circle at 30% 40%,#6b7280,#30343a)"></span>Guss</button>
      <button class="btn" data-tool="steel" title="Stahl"><span class="sw" style="background:linear-gradient(180deg,#f1f5f9,#7c8ea3 55%,#c7d2de)"></span>Stahl</button>
      <button class="btn" data-tool="concrete" title="Beton"><span class="sw" style="background:#a8acae;height:12px;border-radius:3px"></span>Beton</button>
      <button class="btn" data-tool="cable" title="Kabel"><span class="sw" style="background:#e8b931;height:3px"></span>Kabel</button>
      <button class="btn" data-tool="rope" title="Stahlseil"><span class="sw" style="background:repeating-linear-gradient(60deg,#eef3f8 0 3px,#7d8a98 3px 6px);height:5px"></span>Stahlseil</button>
    </div>
    <div class="sep"></div>
    <div class="group" id="gEdit">
      <button class="btn" data-tool="delete" title="Löschen"><span class="ic">✂️</span>Löschen</button>
      <button class="btn" id="bUndo" title="Rückgängig"><span class="ic">↶</span>Zurück</button>
      <button class="btn warn" id="bReset" title="Alles löschen"><span class="ic">🗑️</span>Alles</button>
      <button class="btn" id="bVeh" title="Fahrzeug"><span class="ic" id="vehIc">🚗</span><span id="vehTxt">Auto</span></button>
    </div>
    <div class="sep"></div>
    <div class="group">
      <button class="btn" id="bLevels"><span class="ic">🗺️</span>Level</button>
      <button class="btn" id="bView" title="Ansicht zurücksetzen"><span class="ic">🎯</span>Ansicht</button>
      <button class="btn" id="bHelp"><span class="ic">💡</span>Tipps</button>
      <button class="btn" id="bExample" title="Beispielbrücke laden (ohne Sterne)"><span class="ic">📐</span>Beispiel</button>
      <button class="btn go" id="bGo"><span class="ic">▶</span><span id="goTxt">Testen</span></button>
    </div>
  </nav>
</div>
<div class="overlay" id="ovLevels"><div class="card"><h2>🗺️ Level wählen</h2><div class="lvlgrid" id="lvlGrid"></div><div class="btns"><button class="btn" data-close>Schließen</button></div></div></div>
<div class="overlay" id="ovIntro"><div class="card"><h2 id="introTitle"></h2><p id="introDesc"></p><ol class="tips" id="introTips"></ol>
<p style="font-size:12px;opacity:.75">Bauen: vom Knoten <b>ziehen</b> oder <b>Start- und Endpunkt antippen</b>. Zu lange Stäbe werden <b>automatisch geteilt</b>. Ansicht: zwei Finger (zoomen/verschieben), Mausrad, rechte Maustaste, 🎥 Kamerawinkel. 📐 lädt eine Beispielbrücke (ohne Sterne).</p>
<div class="btns"><button class="btn go" data-close>Los geht's!</button></div></div></div>
<div class="overlay" id="ovResult"><div class="card" id="resCard"><h2 id="resTitle"></h2><div class="stars" id="resStars"></div><p id="resText"></p><div class="btns" id="resBtns"></div></div></div>
