<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Bridge Constructor Prototyp - Grok</title>
    <style>
        body { margin: 0; background: #1a1a2e; color: white; font-family: Arial, sans-serif; }
        #canvas-container { text-align: center; margin-top: 10px; }
        canvas { border: 2px solid #4a90e2; background: #0f0f23; }
        #controls { text-align: center; padding: 10px; }
        button { margin: 5px; padding: 8px 16px; background: #4a90e2; color: white; border: none; cursor: pointer; }
        button:hover { background: #357abd; }
        .info { margin: 10px; font-size: 14px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>
    <div id="controls">
        <h2>Bridge Constructor Prototyp</h2>
        <button onclick="startSimulation()">Simulation starten</button>
        <button onclick="reset()">Reset</button>
        <button onclick="addWood()">Holz hinzufügen</button>
        <button onclick="addSteel()">Stahl hinzufügen</button>
        <button onclick="addCable()">Kabel hinzufügen</button>
        <div class="info">
            Klicke um Knoten zu setzen und Balken zu ziehen. Stress: Grün = ok, Gelb = Warnung, Rot = kritisch
        </div>
    </div>
    <div id="canvas-container">
        <canvas id="world" width="900" height="500"></canvas>
    </div>

    <script>
        const { Engine, Render, Runner, Bodies, Body, Composite, Composites, Constraint, Mouse, MouseConstraint, Events } = Matter;

        const canvas = document.getElementById('world');
        const engine = Engine.create();
        const world = engine.world;
        engine.gravity.y = 1;

        const render = Render.create({
            canvas: canvas,
            engine: engine,
            options: {
                width: 900,
                height: 500,
                wireframes: false,
                background: '#0f0f23'
            }
        });

        const runner = Runner.create();
        Runner.run(runner, engine);
        Render.run(render);

        // Ground and anchors
        const groundLeft = Bodies.rectangle(100, 450, 200, 40, { isStatic: true, render: { fillStyle: '#333' } });
        const groundRight = Bodies.rectangle(800, 450, 200, 40, { isStatic: true, render: { fillStyle: '#333' } });
        Composite.add(world, [groundLeft, groundRight]);

        // Materials
        const materials = {
            wood: { color: '#8B4513', stiffness: 0.8, maxStress: 0.5, density: 0.001 },
            steel: { color: '#708090', stiffness: 0.95, maxStress: 1.2, density: 0.003 },
            cable: { color: '#FFD700', stiffness: 0.6, maxStress: 0.8, density: 0.0005 }
        };

        let currentMaterial = 'wood';
        let nodes = [];
        let beams = [];
        let isBuilding = true;

        function addWood() { currentMaterial = 'wood'; }
        function addSteel() { currentMaterial = 'steel'; }
        function addCable() { currentMaterial = 'cable'; }

        // Simple node placement and beam connection
        canvas.addEventListener('click', (e) => {
            if (!isBuilding) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // Create node
            const node = Bodies.circle(x, y, 8, {
                isStatic: true,
                render: { fillStyle: '#4a90e2' }
            });
            nodes.push(node);
            Composite.add(world, node);

            // Connect to previous if close enough
            if (nodes.length > 1) {
                const prev = nodes[nodes.length - 2];
                const dist = Math.hypot(node.position.x - prev.position.x, node.position.y - prev.position.y);
                if (dist < 200) {
                    const mat = materials[currentMaterial];
                    const beam = Constraint.create({
                        bodyA: prev,
                        bodyB: node,
                        stiffness: mat.stiffness,
                        length: dist,
                        render: {
                            strokeStyle: mat.color,
                            lineWidth: currentMaterial === 'cable' ? 2 : 6
                        }
                    });
                    beam.material = currentMaterial;
                    beam.maxStress = mat.maxStress;
                    beams.push(beam);
                    Composite.add(world, beam);
                }
            }
        });

        // Stress visualization
        Events.on(engine, 'afterUpdate', () => {
            beams.forEach(beam => {
                if (!beam.render) return;
                const force = Math.abs(beam.stiffness * (beam.length - Constraint.length(beam))); // simplified
                const stressRatio = force / beam.maxStress;
                if (stressRatio > 1.5) {
                    beam.render.strokeStyle = '#ff0000';
                } else if (stressRatio > 0.8) {
                    beam.render.strokeStyle = '#ffaa00';
                } else {
                    beam.render.strokeStyle = materials[beam.material].color;
                }
            });
        });

        // Vehicle
        let vehicle = null;
        function startSimulation() {
            isBuilding = false;
            // Make nodes dynamic for simulation (except anchors)
            nodes.forEach((n, i) => {
                if (i !== 0 && i !== nodes.length - 1) {
                    Body.setStatic(n, false);
                    n.density = 0.001;
                }
            });

            // Spawn vehicle
            vehicle = Bodies.rectangle(150, 350, 40, 20, {
                density: 0.01,
                render: { fillStyle: '#ff4444' }
            });
            Composite.add(world, vehicle);
        }

        function reset() {
            Composite.clear(world, false);
            Composite.add(world, [groundLeft, groundRight]);
            nodes = [];
            beams = [];
            vehicle = null;
            isBuilding = true;
            Engine.clear(engine);
        }

        // Mouse drag for testing
        const mouse = Mouse.create(canvas);
        const mouseConstraint = MouseConstraint.create(engine, {
            mouse: mouse,
            constraint: { stiffness: 0.2, render: { visible: false } }
        });
        Composite.add(world, mouseConstraint);
        render.mouse = mouse;
    </script>
</body>
</html>
