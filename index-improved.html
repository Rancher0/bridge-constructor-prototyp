<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bridge Constructor – Verbesserte Version</title>
<style>
body { margin:0; background:#0d1b2a; color:#eef3f8; font-family:system-ui,sans-serif; overflow:hidden; }
#app { display:flex; flex-direction:column; height:100vh; }
#hud { display:flex; align-items:center; gap:12px; padding:8px 12px; background:#13263b; }
#budget { flex:1; }
#budget .bar { height:8px; background:#ffffff20; border-radius:4px; margin-top:4px; }
#budget .fill { height:100%; background:#34c759; width:0; transition:width .2s; }
#stage { flex:1; position:relative; }
canvas { width:100%; height:100%; display:block; background:#0f1f31; }
#toolbar { display:flex; gap:6px; padding:8px; background:#0f1f31; flex-wrap:wrap; justify-content:center; }
button { padding:8px 12px; background:#22384f; color:white; border:none; border-radius:8px; cursor:pointer; font-weight:600; }
button.sel { background:#3b82c4; }
button.go { background:#2f9e44; }
#hint { position:absolute; top:10px; left:50%; transform:translateX(-50%); background:#0b1726d0; padding:6px 12px; border-radius:8px; font-size:13px; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body>
<div id="app">
  <header id="hud">
    <div id="lvl">Level 1 – Einfache Brücke</div>
    <div id="budget"><div>Budget: <b id="cost">0</b> / <span id="max">200</span> €</div><div class="bar"><div class="fill" id="fill"></div></div></div>
  </header>
  <main id="stage">
    <canvas id="world"></canvas>
    <div id="hint">Klicke um Knoten zu setzen und Balken zu ziehen. Materialien unten wählen.</div>
  </main>
  <nav id="toolbar">
    <button class="sel" data-mat="wood">Holz (5€)</button>
    <button data-mat="steel">Stahl (15€)</button>
    <button data-mat="cable">Kabel (3€)</button>
    <button data-mat="road">Straße (8€)</button>
    <button id="start">Simulation starten</button>
    <button id="reset">Reset</button>
  </nav>
</div>
<script>
const { Engine, Render, Runner, Bodies, Body, Composite, Constraint, Mouse, MouseConstraint, Events } = Matter;
const canvas = document.getElementById('world');
const engine = Engine.create();
engine.gravity.y = 1.2;
const render = Render.create({ canvas, engine, options: { width: window.innerWidth, height: window.innerHeight-140, wireframes: false, background: '#0f1f31' } });
Render.run(render);
Runner.run(Runner.create(), engine);

const materials = {
  wood: { color: '#b7793e', stiffness: 0.85, maxStress: 0.6, cost: 5, width: 6 },
  steel: { color: '#8ea4bd', stiffness: 0.98, maxStress: 1.5, cost: 15, width: 7 },
  cable: { color: '#e8c547', stiffness: 0.5, maxStress: 0.9, cost: 3, width: 2 },
  road: { color: '#3d434c', stiffness: 0.9, maxStress: 0.8, cost: 8, width: 10 }
};
let current = 'wood', nodes = [], beams = [], budget = 200, spent = 0, building = true;
const groundL = Bodies.rectangle(80, 420, 160, 40, { isStatic: true, render: { fillStyle: '#333' } });
const groundR = Bodies.rectangle(window.innerWidth-80, 420, 160, 40, { isStatic: true, render: { fillStyle: '#333' } });
Composite.add(engine.world, [groundL, groundR]);

document.querySelectorAll('#toolbar button[data-mat]').forEach(b => {
  b.onclick = () => { current = b.dataset.mat; document.querySelectorAll('#toolbar button').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); };
});

canvas.addEventListener('click', e => {
  if (!building) return;
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  const node = Bodies.circle(x, y, 7, { isStatic: true, render: { fillStyle: '#ff4444' } });
  nodes.push(node); Composite.add(engine.world, node);
  if (nodes.length > 1) {
    const prev = nodes[nodes.length-2];
    const dist = Math.hypot(node.position.x-prev.position.x, node.position.y-prev.position.y);
    if (dist < 220 && spent + materials[current].cost <= budget) {
      const mat = materials[current];
      const beam = Constraint.create({ bodyA: prev, bodyB: node, stiffness: mat.stiffness, length: dist, render: { strokeStyle: mat.color, lineWidth: mat.width } });
      beam.mat = current; beam.maxStress = mat.maxStress; beams.push(beam); Composite.add(engine.world, beam);
      spent += mat.cost; updateBudget();
    }
  }
});

function updateBudget() {
  document.getElementById('cost').textContent = spent;
  document.getElementById('fill').style.width = Math.min(100, (spent/budget)*100) + '%';
}

Events.on(engine, 'afterUpdate', () => {
  beams.forEach(b => {
    if (!b.render) return;
    const force = Math.abs(b.stiffness * (b.length - Constraint.length(b)));
    const ratio = force / b.maxStress;
    b.render.strokeStyle = ratio > 1.2 ? '#ff4136' : ratio > 0.7 ? '#ffdc00' : materials[b.mat].color;
  });
});

document.getElementById('start').onclick = () => {
  building = false;
  nodes.forEach((n,i) => { if (i>0 && i<nodes.length-1) Body.setStatic(n, false); });
  const veh = Bodies.rectangle(120, 350, 50, 22, { density: 0.015, render: { fillStyle: '#ff4444' } });
  Composite.add(engine.world, veh);
};
document.getElementById('reset').onclick = () => location.reload();
</script>
</body>
</html>
